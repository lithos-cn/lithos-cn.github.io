# ===================== 测试版配置（所有占位符之后替换） =====================
# 使用 Minimal Mistakes 主题（gem 方式）
theme: minimal-mistakes-jekyll

# 站点标题（显示在顶部导航栏左侧）
title: "测试站点"
name: "测试用户"
description: "一句话简介（测试）"

url: "https://lithos-cn.github.io"
# 如果你保留仓库名 lithos.github.io（不改成 lithos-cn.github.io），需要额外加一行：
# baseurl: "/lithos.github.io"

locale: "zh-CN"
timezone: "Asia/Shanghai"

plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-polyglot

# 多语言（中英切换）
languages: ["zh", "en"]
default_lang: "zh"
exclude_from_localization: ["assets", "images", "javascript", "css", "sitemap.xml", "feed.xml"]
parallel_localization: true

# 让 Jekyll 处理 _pages 目录下的页面（Minimal Mistakes 的约定）
include: ["_pages"]

# ===================== 作者信息（左侧作者栏） =====================
author:
  name: "测试用户"
  avatar: "/images/profile.svg"     # 测试用占位头像，正式版换成 /images/profile.jpg
  bio: "这里是简介，正式版再改"
  location: "地球"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:test@example.com"

# ===================== 默认布局 =====================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true

# ===================== 博客列表（首页分页） =====================
paginate: 5
paginate_path: /page:num/

# ===================== 其它 =====================
toc: true
